[build-system]
requires = ["setuptools>=59.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snapppi"
version = "2026.07.03"
authors = [
  {name="Keaun Amani"},
]
description = "SnapPPI: sequence-based protein interaction prediction with frozen protein language model embeddings and lightweight adapters."
license = {file = "LICENSE"}
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.8"
dependencies = [
  "accelerate",
  "torch",
  "transformers",
  "sentencepiece",
  "duckdb",
  "neurosnap",
  "numpy",
  "pandas",
  "scikit-learn",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "plotly",
  "ruff",
  "tiktoken",
  "protobuf",
]

[project.urls]
Homepage = "https://github.com/NeurosnapInc/SnapPPI"
Issues = "https://github.com/NeurosnapInc/SnapPPI/issues"

[tool.setuptools]
py-modules = ["aggregate_data", "calibration", "config", "contract", "migrate_checkpoints", "model", "run_utils", "summarize_runs", "tokenize_data", "train", "validate"]
packages = ["sources"]

[tool.ruff]
line-length = 150
indent-width = 2
